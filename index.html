<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6가지 분석 렌즈 | 연구회 AI 융합수업 사례 비평</title>
<meta name="description" content="6가지 분석 렌즈로 AI 융합수업 사례를 함께 비평하는 연구회용 웹앱">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --ink:#0f1b33; --sub:#5d6880; --line:#dde4ee; --soft:#e7edf6;
  --navy:#13295c; --ok:#16834f; --err:#cf2a45; --err-bg:#fbe4e8;
  --edu:#0b6bcb; --edu-bg:#e1ecf8; --learner:#0f8a5f; --learner-bg:#dff0ea; --tech:#5a4fcf; --tech-bg:#e8e7f8;
  --eval:#d97706; --eval-bg:#f6ece2; --ethic:#cf2a45; --ethic-bg:#f5e4e9; --exec:#0b8fa1; --exec-bg:#dff0f3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
a{color:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:34px;margin:6px 0 6px;letter-spacing:-.03em}
h2{font-size:22px;margin:0 0 14px;letter-spacing:-.02em}
h3{font-size:17px;margin:0 0 8px}
p{margin:0 0 10px}
.badge{display:inline-block;font-size:13px;font-weight:700;color:var(--navy);background:var(--soft);padding:5px 14px;border-radius:999px}
.lead{color:var(--sub);font-size:17px;margin:0 0 26px}
.muted{color:var(--sub)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;margin-bottom:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label{display:block;font-size:15px;font-weight:700;margin:16px 0 8px}
.req{color:var(--err)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #d6e2f5;border-color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:16px;padding:12px 22px;border-radius:16px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.plain{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.btn.sm{font-size:14px;padding:8px 14px;border-radius:12px}
.btn.block{width:100%}
.btn.dsoft{background:var(--err-bg);border-color:var(--err-bg);color:var(--err)}
.btn.danger{background:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;font:inherit;color:var(--sub);cursor:pointer;text-decoration:none}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.pill{font:inherit;font-weight:700;font-size:16px;padding:11px 22px;border-radius:999px;border:1.5px solid transparent;background:var(--soft);color:var(--ink);cursor:pointer}
.pill.on{background:var(--navy);color:#fff}
.pill.out{background:#fff;border-color:var(--line)}
.pill.sm{font-size:14px;padding:8px 16px}
.mepill{background:var(--soft);border-radius:999px;padding:10px 20px;font-weight:700}
.codebox{background:var(--navy);color:#fff;border-radius:999px;padding:14px 28px;font-size:16px}
.codebox b{font-size:30px;letter-spacing:.04em;margin-left:10px}
.notice{background:#e3edfb;border-radius:22px;padding:20px 24px}
.notice ul{margin:8px 0 0;padding-left:20px}
.done{background:#e6f4ec;color:#11603b;border-radius:16px;padding:14px 18px;margin-bottom:12px;font-weight:600}
/* 렌즈 */
.lcard{background:var(--cb);border:1px solid color-mix(in srgb,var(--c) 28%,#fff);border-radius:24px;padding:22px}
.lcard .t{color:var(--c);font-weight:800;font-size:15px}
.lcard h3{margin:4px 0 8px}
.lcard ul{margin:0;padding-left:18px;color:var(--sub);font-size:14px}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;border:1.5px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:20px;padding:16px 18px;background:#fff;cursor:pointer;color:var(--ink)}
.opt .on-n{color:var(--c);font-weight:800;font-size:17px}
.opt .oq{color:var(--sub);font-size:14px}
.opt.on{background:var(--cb);border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.fbox{border-left:5px solid var(--c);background:color-mix(in srgb,var(--cb) 45%,#fff);border-radius:0 20px 20px 0;padding:6px 20px 18px;margin:18px 0}
.fbox .ft{color:var(--c);font-weight:800;margin-top:12px}
.lbox{background:var(--cb);border:1px solid color-mix(in srgb,var(--c) 28%,#fff);border-radius:26px;padding:22px}
.lbox .hd{display:flex;justify-content:space-between;align-items:center;color:var(--c);font-weight:800;font-size:19px;margin-bottom:6px}
.cnt{background:var(--c);color:#fff;border-radius:999px;padding:0 10px;font-size:13px;min-width:28px;text-align:center}
.crit{background:#fff;border-radius:20px;padding:16px 20px;border-left:5px solid var(--c);margin-top:12px;box-shadow:0 1px 3px rgba(15,27,51,.07)}
.crit .txt{white-space:pre-wrap;margin-top:6px;font-size:15px}
.crit .lab{color:var(--c);font-weight:700}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--cb);color:var(--c)}
.decision{background:#dfeafa;border-radius:22px;padding:20px 24px;margin-top:16px}
.decision p{white-space:pre-wrap;margin:6px 0 0;font-size:15px}
.dform{background:#eef3fb;border-radius:22px;padding:18px 22px;margin-top:18px}
.ctitle{font-size:24px;margin:4px 0 14px;letter-spacing:-.02em}
.ccard{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:22px;padding:18px 20px;cursor:pointer}
.ccard.on{border-color:var(--navy);background:#fff}
.ccard .ct{font-weight:800;font-size:18px;margin:2px 0 10px}
.lchip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fff;color:var(--sub)}
.lchip.on{background:var(--c);color:#fff}
.tile{background:var(--cb);border-radius:20px;padding:16px;text-align:center;color:var(--c)}
.tile b{display:block;font-size:34px;line-height:1.1}
.tile span{color:var(--ink);font-weight:700;font-size:14px}
.lview{background:var(--cb);border:1px solid color-mix(in srgb,var(--c) 28%,#fff);border-radius:30px;padding:36px}
.lview .t{color:var(--c);font-weight:800}
.lview h2{font-size:32px;margin:6px 0 10px}
.wcard{background:#fff;border-radius:24px;padding:24px 28px;box-shadow:0 1px 3px rgba(15,27,51,.06)}
.wcard h3{color:var(--c)}
.wcard.q h3{color:var(--ink)}
.wcard ul{margin:0;padding-left:18px}
.lnav .pill{background:var(--cb);color:var(--c)}
.lnav .pill.on{background:var(--c);color:#fff}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:15px;z-index:9;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.demo{background:#fef3c7;color:#78350f;font-size:13px;text-align:center;padding:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
@media (max-width:600px){h1{font-size:27px}.card{padding:20px}.lview{padding:22px}.lview h2{font-size:24px}.codebox b{font-size:22px}}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap" id="app">불러오는 중…</div>
<div class="toast" id="toast"></div>

<script>
/* ================== 설정 ================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzDYLFGqArNcZI36WeELyhwb0oVsJSr5HC5GtejV_gW9acC4xvNWV5OFvNrHd9K-qWj/exec',                         // ★ Apps Script 웹 앱 URL. 비워 두면 이 브라우저 안에서만 동작하는 '체험 모드'
  CLUB_NAME: '안산디지털온교육연구회',           // ★ 연구회 이름
  EVENT_LABEL: '인공지능 수업(활용, 융합) 실천 사례 나눔',
  MAX_GROUPS: 3,                       // ★ 첫 화면 모둠 선택지 수
  POLL_MS: 8000                        // 자동 새로고침 간격(ms)
};

/* ================== 렌즈 데이터 ================== */
const LENSES = [
  { id:'edu', no:'01', name:'교육적 관점', short:'교육적', q:'AI 활용이 학습목표 달성에 어떻게 기여했는가',
    bullets:['성취기준과 AI 활동의 연결','교과 고유의 사고 방식이 구현된 장면'],
    intro:'교과 목표, 학생이 할 사고, AI의 지원을 하나의 관계로 봅니다.',
    points:[['목표와 과제','사회과의 판단, 수학의 관계 설명, 과학의 증거 검토처럼 해당 교과에서 필요한 사고가 과제에 드러나는지 봅니다.'],
            ['AI의 기여','AI의 생성·분류·제안이 학생의 사고를 어디에서 도왔는지 확인합니다. 결과물 완성만으로 목표 달성을 판단하지 않습니다.']],
    asks:['학생은 이 활동에서 무엇을 비교·설명·판단해야 했습니까?','목표 → 학생 사고 → 활동 → 근거가 연결되어 있습니까?'] },
  { id:'learner', no:'02', name:'학습자 관점', short:'학습자', q:'학생이 스스로 생각하고 선택할 기회가 어디에 있었는가',
    bullets:['학생의 판단이 필요한 지점','AI 결과를 검토하거나 수정한 흔적'],
    intro:'클릭·입력·발표한 양보다 선택하고 이유를 설명할 기회를 봅니다.',
    points:[['학생의 판단 지점','문제 정하기, 자료 선택, 분류 기준 세우기, AI 제안 검토, 수정·유지 이유 설명 중 학생이 맡은 부분을 찾습니다.'],
            ['판단을 위한 지원','읽기·쓰기 수준, 선행지식, 토론 경험, 접근성에 따라 필요한 지원을 확인합니다. 도구 사용 숙련과 교과 이해를 구분합니다.']],
    asks:['학생이 직접 정한 기준·문제·대안은 무엇입니까?','기기를 조작하지 않은 학생도 판단에 참여했습니까?'] },
  { id:'tech', no:'03', name:'기술적 관점', short:'기술적', q:'활용한 기술이 수업 목적과 학생 수준에 맞았는가',
    bullets:['도구 선택의 이유','학생이 다루기에 적절한 수준이었는지'],
    intro:'생성, 분류, 예측, 제안, 자동화의 역할과 검토 절차를 확인합니다.',
    points:[['역할의 적합성','AI가 맡은 일, 교사가 맡은 일, 학생이 맡은 일을 나눕니다. 도구가 필요한 이유를 교과 활동과 연결합니다.'],
            ['출력의 검토','입력과 출력이 어떻게 연결되는지, 실제 과제에서 오류와 한계를 어떻게 찾고 처리했는지 확인합니다.']],
    asks:['교사가 AI를 활용했습니까, 학생이 직접 활용했습니까?','정확하다는 판단은 어떤 자료에서 나왔습니까?'] },
  { id:'eval', no:'04', name:'평가 관점', short:'평가', q:'학생의 사고 과정과 AI 활용 과정을 어떻게 확인했는가',
    bullets:['수집한 학습 증거의 종류','과정을 남기는 방법'],
    intro:'결과물과 학생의 사고·판단을 연결하는 자료를 찾습니다.',
    points:[['주장에 맞는 자료','“판단을 설명했다”에는 이유 설명이, “검토하며 수정했다”에는 이전·이후 선택과 수정 이유가 필요합니다.'],
            ['판단의 범위','모둠 결과물을 개인의 이해로 확대하지 않습니다. AI와 함께 수행한 결과와 학생에게 남은 이해를 구분합니다.']],
    asks:['그 판단을 바탕으로 어떤 지원을 바꾸었습니까?','다음 수업에서 같은 문제를 확인할 자료는 무엇입니까?'] },
  { id:'ethic', no:'05', name:'윤리적 관점', short:'윤리적', q:'AI 활용의 한계와 책임을 어떻게 다루었는가',
    bullets:['오류·편향·저작권·개인정보 안내','문제가 생겼을 때의 대응'],
    intro:'정확성, 정보 공개, 공정한 참여, 책임의 문제를 실제 운영 절차로 봅니다.',
    points:[['자료와 출력의 책임','어떤 정보를 수집·입력·공유했는지, AI 출력의 오류를 누가 확인하고 정정하는지 살펴봅니다.'],
            ['선택과 참여의 책임','학생이 제안을 거부하거나 다른 방식으로 참여할 수 있었는지, 불리한 학생에게 지원이 있었는지 확인합니다.']],
    asks:['수집 → 입력 → 출력 검토 → 공유 → 보관 중 누가 결정했습니까?','학생이 AI 사용 내역과 오류 정정을 설명할 기회가 있었습니까?'] },
  { id:'exec', no:'06', name:'실행 관점', short:'실행', q:'시간·기기·학생 여건에서 실행 가능한 설계였는가',
    bullets:['계획과 실제 소요 차시의 차이','다른 교실에서 재현할 때 필요한 조건'],
    intro:'시간, 기기, 자료 준비, 교사 지원, 참여 방식의 조건을 함께 봅니다.',
    points:[['운영 조건','학년·학급 규모·기기 공유·접속·수업 시간과 교사의 사전 준비를 확인합니다. 계획과 실제 운영의 차이도 남깁니다.'],
            ['전이 조건','우리 학급에서 같은 부분과 바꿔야 할 부분을 나눕니다. 사례의 외형보다 학습을 가능하게 한 조건을 옮깁니다.']],
    asks:['미리 준비한 자료·계정·기기는 무엇입니까?','다시 한다면 핵심 활동과 지원을 어떻게 조정하겠습니까?'] }
];
const LENS = Object.fromEntries(LENSES.map(l => [l.id, l]));
const FLOW = [
  ['① 렌즈 익히기','6가지 관점과 관찰 질문을 배웁니다.'],
  ['② 내 사례 공유','내 수업 사례와 의사결정 지점을 올립니다.'],
  ['③ 동료 사례 비평','모둠원 사례를 한 사례당 렌즈 2개로 비평합니다.'],
  ['④ 렌즈 모으기','여섯 관점의 관찰을 모아 설계 원리를 정리합니다.']
];

/* ================== 체험 모드용 공통 로직 (Code.gs의 handle_와 동일) ================== */
function handle_(p, db) {
  const S = v => String(v == null ? '' : v).trim();
  const now = new Date().toISOString();
  const code = S(p.code).toUpperCase();
  const LENS_IDS = ['edu', 'learner', 'tech', 'eval', 'ethic', 'exec'];
  const sessionOf = c => db.rows('Sessions').find(r => S(r.code).toUpperCase() === c);
  const norm = s => ({
    code: S(s.code), title: S(s.title),
    groups: Number(s.groups) || 3, perLens: Number(s.perLens) || 2, createdAt: S(s.createdAt)
  });
  const needSession = () => {
    const s = sessionOf(code);
    if (!s) throw new Error('입장 코드를 확인해 주세요.');
    return norm(s);
  };
  const needAdmin = () => { if (S(p.pw) !== S(db.adminPw)) throw new Error('운영진 비밀번호가 맞지 않습니다.'); };
  const byCode = n => db.rows(n).filter(r => S(r.code).toUpperCase() === code);
  const sameCode = r => S(r.code).toUpperCase() === code;
  const needMember = () => {
    const m = byCode('Members').find(r => S(r.id) === S(p.memberId));
    if (!m) throw new Error('회원 정보를 찾을 수 없습니다. 다시 입장해 주세요.');
    return m;
  };
  const link = v => { v = S(v); if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v; return v; };
  const caseFields = () => ({
    title: S(p.title), grade: S(p.grade), link: link(p.link),
    situation: S(p.situation), thought: S(p.thought), choice: S(p.choice)
  });

  switch (p.action) {
    case 'session':
      return needSession();

    case 'join': {
      const ses = needSession();
      const name = S(p.name), group = S(p.group);
      if (!name) throw new Error('이름을 입력해 주세요.');
      if (!group) throw new Error('모둠을 선택해 주세요.');
      if (Number(group) > ses.groups) throw new Error('이 모임은 ' + ses.groups + '모둠까지 있습니다.');
      const old = byCode('Members').find(r => S(r.name) === name && S(r.group) === group);
      if (old) return old;
      return db.upsert('Members', () => false, { code: code, name: name, group: group, createdAt: now });
    }

    case 'room': {
      const session = needSession(), me = needMember(), g = S(me.group);
      const cases = byCode('Cases').filter(c => S(c.group) === g);
      const ids = cases.map(c => S(c.id));
      return {
        session: session, me: me,
        members: byCode('Members').filter(m => S(m.group) === g),
        cases: cases,
        critiques: byCode('Critiques').filter(k => ids.indexOf(S(k.target)) >= 0)
      };
    }

    case 'saveCase': {
      needSession();
      const m = needMember(), f = caseFields();
      if (!f.title) throw new Error('수업 제목을 입력해 주세요.');
      if (!f.situation) throw new Error('의사결정 지점의 [상황]을 입력해 주세요.');
      const id = S(p.id);
      if (id) {
        const own = byCode('Cases').find(r => S(r.id) === id && S(r.memberId) === S(m.id));
        if (!own) throw new Error('내 사례만 고칠 수 있어요.');
        return db.upsert('Cases', r => S(r.id) === id, Object.assign(f, { updatedAt: now }));
      }
      return db.upsert('Cases', () => false,
        Object.assign({ code: code, group: S(m.group), memberId: S(m.id), name: S(m.name) }, f, { updatedAt: now }));
    }

    case 'deleteCase': {
      needSession();
      const m = needMember(), id = S(p.id);
      const n = db.remove('Cases', r => sameCode(r) && S(r.id) === id && S(r.memberId) === S(m.id));
      if (n) db.remove('Critiques', r => sameCode(r) && S(r.target) === id);
      return { removed: n };
    }

    case 'saveCritiques': {
      const ses = needSession(), m = needMember(), target = S(p.target);
      const c = byCode('Cases').find(r => S(r.id) === target);
      if (!c) throw new Error('사례를 찾을 수 없습니다. 삭제되었을 수 있어요.');
      if (S(c.memberId) === S(m.id)) throw new Error('내 사례는 비평할 수 없어요.');
      if (S(c.group) !== S(m.group)) throw new Error('우리 모둠 사례만 비평할 수 있어요.');
      const items = (Array.isArray(p.items) ? p.items : [])
        .map(i => ({ lens: S(i.lens), observe: S(i.observe), question: S(i.question), idea: S(i.idea) }))
        .filter((i, idx, a) => LENS_IDS.indexOf(i.lens) >= 0 && a.findIndex(x => x.lens === i.lens) === idx);
      if (!items.length) throw new Error('렌즈를 하나 이상 골라 주세요.');
      if (items.length > ses.perLens) throw new Error('한 사례에 렌즈는 ' + ses.perLens + '개까지 쓸 수 있어요.');
      if (items.some(i => !i.observe)) throw new Error('렌즈마다 [관찰한 장면·특징]을 적어 주세요.');
      const mine = r => sameCode(r) && S(r.target) === target && S(r.memberId) === S(m.id);
      const keep = items.map(i => i.lens);
      db.remove('Critiques', r => mine(r) && keep.indexOf(S(r.lens)) < 0);
      return items.map(i => db.upsert('Critiques', r => mine(r) && S(r.lens) === i.lens, {
        code: code, target: target, group: S(m.group), memberId: S(m.id), name: S(m.name),
        lens: i.lens, observe: i.observe, question: i.question, idea: i.idea, updatedAt: now
      }));
    }

    /* ---------- 운영진 ---------- */
    case 'adminCheck':
      needAdmin();
      return { ok: true };

    case 'adminSessions':
      needAdmin();
      return db.rows('Sessions').map(norm).sort((a, b) => b.createdAt.localeCompare(a.createdAt));

    case 'adminCreate': {
      needAdmin();
      if (!code) throw new Error('입장 코드를 입력해 주세요.');
      if (sessionOf(code)) throw new Error('이미 쓰고 있는 입장 코드입니다.');
      return norm(db.upsert('Sessions', () => false, {
        code: code, title: S(p.title) || '연구회 모임',
        groups: S(p.groups) || '3', perLens: S(p.perLens) || '2', createdAt: now
      }));
    }

    case 'adminAll':
      needAdmin();
      return {
        session: needSession(),
        members: byCode('Members'),
        cases: byCode('Cases'), critiques: byCode('Critiques'),
        sheetUrl: db.sheetUrl || ''
      };

    case 'adminUpdate': {
      needAdmin();
      needSession();
      const patch = {};
      ['title', 'groups', 'perLens'].forEach(k => { if (p[k] != null && S(p[k]) !== '') patch[k] = S(p[k]); });
      return norm(db.upsert('Sessions', sameCode, patch));
    }

    case 'adminClear': {
      needAdmin();
      needSession();
      const w = S(p.what), out = {};
      if (w === 'critiques' || w === 'all') out.critiques = db.remove('Critiques', sameCode);
      if (w === 'cases' || w === 'all') {
        out.cases = db.remove('Cases', sameCode);
        db.remove('Critiques', sameCode);
      }
      return out;
    }

    default:
      throw new Error('알 수 없는 요청: ' + p.action);
  }
}

const mockDB = {
  adminPw: '1234', sheetUrl: '',
  _mem: null,
  _load(){ try { return JSON.parse(localStorage.getItem('lens_mock2') || '{}'); } catch(e){ return this._mem || (this._mem = {}); } },
  _save(d){ try { localStorage.setItem('lens_mock2', JSON.stringify(d)); } catch(e){ this._mem = d; } },
  rows(n){ return (this._load()[n] || []).map(r => Object.assign({}, r)); },
  upsert(n, match, obj){
    const d = this._load(), list = d[n] || [], i = list.findIndex(match); let out;
    if (i >= 0) { out = Object.assign({}, list[i], obj); list[i] = out; }
    else { out = Object.assign({ id:'m' + Date.now().toString(36) + Math.random().toString(36).slice(2,6) }, obj); list.push(out); }
    d[n] = list; this._save(d); return out;
  },
  remove(n, match){
    const d = this._load(), list = d[n] || [], keep = list.filter(r => !match(r));
    d[n] = keep; this._save(d); return list.length - keep.length;
  }
};

const S = v => String(v == null ? '' : v).trim();

const b64url = s => {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_');
};
async function getJSON(url){
  let res;
  try { res = await fetch(url, { cache:'no-store', credentials:'omit', redirect:'follow' }); }
  catch(e){ throw new Error('서버에 연결하지 못했어요. 인터넷 연결과 API_URL을 확인해 주세요.'); }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e){
    if (text.startsWith('6가지')) throw new Error('Apps Script가 예전 버전이에요. 새 Code.gs를 붙여넣고 [배포 관리 > 새 버전]으로 다시 배포해 주세요.');
    const hint = /열 수 없습니다|unable to open/i.test(text) ? ' (구글이 배포를 찾지 못함 — 시크릿 창에서 열어 보거나 API_URL을 확인해 주세요)' : '';
    throw new Error('서버 응답을 읽지 못했어요. 배포 설정(실행: 나 / 액세스: 모든 사용자)을 확인해 주세요.' + hint);
  }
}
async function call(action, params = {}){
  const p = Object.assign({ action }, params);
  let r;
  if (!CONFIG.API_URL) {
    await new Promise(res => setTimeout(res, 60));
    try { r = { ok:true, data: handle_(JSON.parse(JSON.stringify(p)), mockDB) }; } catch(e){ r = { ok:false, error:e.message }; }
  } else {
    const data = b64url(JSON.stringify(p)), CH = 3500, base = CONFIG.API_URL + '?_=' + Date.now();
    if (data.length <= CH) r = await getJSON(`${base}&p=${encodeURIComponent(data)}`);
    else {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8), n = Math.ceil(data.length / CH);
      for (let i = 0; i < n; i++) {
        r = await getJSON(`${base}&c=${id}&n=${n}&i=${i}&d=${encodeURIComponent(data.slice(i * CH, (i + 1) * CH))}`);
        if (!r.ok) break;
      }
    }
  }
  if (!r.ok) throw new Error(r.error || '오류가 발생했습니다.');
  return r.data;
}

function critForm(target){
  const R = state.room, me = R.me, per = R.session.perLens;
  const saved = R.critiques.filter(k => k.target === target && k.memberId === me.id);
  if (!state.sel[target]) state.sel[target] = LENSES.map(l => l.id).filter(id => saved.some(k => k.lens === id));
  const sel = state.sel[target];
  const taken = id => R.critiques.filter(k => k.target === target && k.lens === id).length;
  const fields = l => {
    const sv = saved.find(k => k.lens === l.id) || {}, key = `cr.${target}.${l.id}.`;
    return `<div class="fbox" style="${ls(l.id)}"><div class="ft">● ${esc(l.name)} <span class="muted small" style="font-weight:500">${esc(l.q)}</span></div>
      <label>2. 관찰한 장면 · 특징 <span class="req">*</span></label>
      <textarea data-d="${key}observe" placeholder="렌즈로 보았을 때 특징적인 장면을 구체적으로 적어 주세요.">${esc(draft(key + 'observe', sv.observe))}</textarea>
      <div class="grid g2" style="gap:14px">
        <div><label>3. 발표자에게 묻고 싶은 질문</label><textarea data-d="${key}question" placeholder="설명만으로는 그려지지 않는 부분">${esc(draft(key + 'question', sv.question))}</textarea></div>
        <div><label>4. 적용·개선 아이디어</label><textarea data-d="${key}idea" placeholder="그대로 가져갈 장면, 조정한다면 어떻게?">${esc(draft(key + 'idea', sv.idea))}</textarea></div>
      </div></div>`;
  };
  return `${saved.length ? `<div class="done">✓ ${saved.map(k => esc(LENS[k.lens].name)).join(', ')}(으)로 비평을 공유했습니다 <span class="small" style="font-weight:500">${hhmm(latest(saved))}</span>
      <div class="small" style="font-weight:500">고친 뒤 다시 공유하면 수정됩니다.</div></div>` : ''}
    <h3>1. 내가 맡을 렌즈 <span class="muted small" style="font-weight:500">— 이 사례에 ${per}개 (${sel.length}/${per})</span></h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${LENSES.map(l => {
      const on = sel.includes(l.id), n = taken(l.id);
      return `<button type="button" class="opt ${on?'on':''}" style="${ls(l.id)}" data-act="pick" data-t="${esc(target)}" data-lens="${l.id}">
        <span class="on-n">${l.no} ${esc(l.name)}${on ? ' ✓' : ''}</span><span class="oq">${esc(l.q)}</span>${n ? `<span class="muted small">모둠 비평 ${n}개</span>` : ''}</button>`;
    }).join('')}</div>
    ${sel.length ? LENSES.filter(l => sel.includes(l.id)).map(fields).join('') : '<p class="muted" style="margin-top:14px">렌즈를 고르면 작성 칸이 나타납니다.</p>'}
    <button class="btn" style="margin-top:6px" data-act="share" data-t="${esc(target)}" ${sel.length ? '' : 'disabled'}>비평 공유하기</button>`;
}

function tabPeer(){
  const R = state.room, me = R.me;
  const peers = R.cases.filter(c => c.memberId !== me.id);
  if (!peers.length) return `<div class="card muted">아직 모둠원이 공유한 사례가 없어요. 모둠원이 [내 사례 공유]에서 사례를 올리면 여기에 나타납니다.</div>`;
  const cur = peers.find(c => c.id === state.peerCase) || peers[0];
  state.peerCase = cur.id;
  const did = c => R.critiques.some(k => k.target === c.id && k.memberId === me.id);
  const others = R.critiques.filter(k => k.target === cur.id && k.memberId !== me.id);
  return `<div class="row" style="margin-bottom:16px"><span class="muted">모둠원 사례 ${peers.length}개 중 <b>${peers.filter(did).length}개</b> 비평 완료</span></div>
  <div class="pills" style="margin-top:0">${peers.map(c => `<button class="pill sm ${c.id===cur.id?'on':''}" data-act="peer" data-id="${esc(c.id)}">${esc(c.name)}${did(c) ? ' ✓' : ''}</button>`).join('')}</div>
  <div class="card split">
    <div>${caseView(cur)}
      <h3 style="margin-top:22px">이 사례에 공유된 비평 (${others.length})</h3>

    <div><h2>이 사례를 렌즈로 비평하기</h2><p class="muted small">강점 기반으로, 구체적 장면을 근거로 이야기해 주세요.</p>${critForm(cur.id)}</div>
  </div>`;
}

function tabGather(){
  const R = state.room, me = R.me;
  if (!R.cases.length) return `<div class="card muted">아직 공유된 사례가 없어요.</div>`;
  const list = R.cases.slice().sort((a, b) => (b.memberId === me.id) - (a.memberId === me.id));
  const cur = list.find(c => c.id === state.gatherCase) || list[0];
  state.gatherCase = cur.id;
  return `<div class="pills" style="margin-top:0">${list.map(c => `<button class="pill sm ${c.id===cur.id?'on':''}" data-act="gcase" data-id="${esc(c.id)}">${esc(c.name)}${c.memberId===me.id ? ' (나)' : ''} · ${esc(c.title.length > 14 ? c.title.slice(0, 14) + '…' : c.title)}</button>`).join('')}</div>
  <h2>${esc(cur.name)} 선생님 사례 — ${esc(cur.title)}</h2>
  ${lensBoxes(R.critiques.filter(k => k.target === cur.id))}`;
}

      await loadAdmin(); renderAdmin();

function downloadCSV(){
  const D = state.admin.all, s = D.session;
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [['구분','모둠','사례 제목','사례 작성자','렌즈','작성자','내용1','내용2','내용3','시각'].map(q).join(',')];
  D.cases.forEach(c => lines.push(['사례 (상황/나의 생각/발표자의 선택)', c.group, c.title, c.name, '', c.name, c.situation, c.thought, c.choice, c.updatedAt].map(q).join(',')));
  D.critiques.forEach(k => { const c = D.cases.find(x => x.id === k.target) || {};
    lines.push(['비평 (관찰/질문/아이디어)', k.group, c.title, c.name, (LENS[k.lens] || {}).name, k.name, k.observe, k.question, k.idea, k.updatedAt].map(q).join(',')); });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${s.title}_${s.code}.csv`; a.click();
}

/* ================== 클릭 처리 ================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, A = state.admin;
  const busy = async fn => { if (el.disabled) return; el.disabled = true; try { await fn(); } catch(err){ toast(err.message); } finally { el.disabled = false; } };
  const val = id => S(document.getElementById(id) && document.getElementById(id).value);

  switch (act) {
    /* 회원 */
    case 'join': return busy(async () => {
      const m = await call('join', { code: val('jc'), name: val('jn'), group: val('jg') });
      state.me = { id:m.id, code:S(m.code), name:m.name, group:S(m.group) }; store.set('lens_me2', state.me);
      state.tab = 'mine'; state.drafts = {}; state.sel = {}; location.hash = '#/room';
    });
    case 'logout': state.me = null; state.room = null; store.del('lens_me2'); clearInterval(pollTimer);
      if (location.hash === '#/' || location.hash === '') return renderHome(); location.hash = '#/'; return;
    case 'tab': state.tab = el.dataset.t; renderRoom(); return window.scrollTo(0, 0);
    case 'lensgo': state.lensIdx = Math.max(0, Math.min(5, Number(el.dataset.i))); return route() === 'room' ? renderRoom() : renderLensPage();
    case 'peer': state.peerCase = el.dataset.id; return renderRoom();
    case 'gcase': state.gatherCase = el.dataset.id; return renderRoom();
    case 'seeGather': state.gatherCase = el.dataset.id; state.tab = 'gather'; renderRoom(); return window.scrollTo(0, 0);
    case 'editCase': state.editCase = el.dataset.id; clearDrafts('case.'); renderRoom(); return window.scrollTo(0, 0);
    case 'cancelEdit': state.editCase = null; clearDrafts('case.'); return renderRoom();
    case 'saveCase': return busy(async () => {
      const p = { code:state.me.code, memberId:state.me.id, id:state.editCase || '' };
      [['title','c_title'],['grade','c_grade'],['link','c_link'],['situation','c_sit'],['thought','c_th'],['choice','c_ch']].forEach(([k, id]) => p[k] = val(id));
      await call('saveCase', p);
      const wasEdit = !!state.editCase; state.editCase = null; clearDrafts('case.');
      await loadRoom(); renderRoom(); toast(wasEdit ? '사례를 수정했어요' : '사례를 공유했어요');
    });
    case 'deleteCase': if (!confirm('이 사례를 삭제할까요? 이 사례에 달린 비평도 함께 지워집니다.')) return;
      return busy(async () => {
        await call('deleteCase', { code:state.me.code, memberId:state.me.id, id:el.dataset.id });
        if (state.editCase === el.dataset.id) { state.editCase = null; clearDrafts('case.'); }
        await loadRoom(); renderRoom(); toast('삭제했어요');
      });
    case 'pick': {
      const t = el.dataset.t, id = el.dataset.lens, per = state.room.session.perLens, sel = state.sel[t] || [];
      if (sel.includes(id)) state.sel[t] = sel.filter(x => x !== id);
      else if (sel.length >= per) return toast(`한 사례에 렌즈는 ${per}개까지예요. 고른 렌즈를 먼저 해제해 주세요.`);
      else state.sel[t] = sel.concat(id);
      return renderRoom();
    }
    case 'share': return busy(async () => {
      const t = el.dataset.t, R = state.room;
      const saved = R.critiques.filter(k => k.target === t && k.memberId === R.me.id);
      const items = (state.sel[t] || []).map(lens => {
        const sv = saved.find(k => k.lens === lens) || {}, key = `cr.${t}.${lens}.`;
        return { lens, observe:S(draft(key + 'observe', sv.observe)), question:S(draft(key + 'question', sv.question)), idea:S(draft(key + 'idea', sv.idea)) };
      });
      const dropped = saved.filter(k => !items.some(i => i.lens === k.lens));
      if (dropped.length && !confirm(`${dropped.map(k => LENS[k.lens].name).join(', ')} 비평은 삭제됩니다. 계속할까요?`)) return;
      await call('saveCritiques', { code:state.me.code, memberId:state.me.id, target:t, items });
      clearDrafts(`cr.${t}.`); delete state.sel[t];
      await loadRoom(); renderRoom(); toast('비평을 공유했어요');
    });

    /* 운영진 */
    case 'adminLogin': return busy(async () => { const pw = val('apw'); await call('adminCheck', { pw }); A.pw = pw; ss.set('lens_pw', pw); enterAdmin(); });
    case 'adminLogout': A.pw = ''; A.code = ''; ss.del('lens_pw'); ss.del('lens_code'); return renderAdminLogin();
    case 'adminCreate': return busy(async () => {
      const s = await call('adminCreate', { pw:A.pw, title:val('ns'), code:val('nc'), groups:val('ng'), perLens:val('np') });
      A.code = s.code; ss.set('lens_code', A.code); A.tab = 1; A.open = null; await enterAdmin(); toast('모임을 만들었어요');
    });
    case 'adminOpen': A.code = el.dataset.code; ss.set('lens_code', A.code); A.tab = 1; A.open = null; return enterAdmin();
    case 'adminBack': clearInterval(pollTimer); A.code = ''; ss.del('lens_code'); return enterAdmin();
    case 'adminRefresh': return busy(async () => { await loadAdmin(); renderAdmin(); toast('새로 불러왔어요'); });
    case 'adminTab': A.tab = Number(el.dataset.n); return renderAdmin();
    case 'adminCase': A.open = A.open === el.dataset.id ? null : el.dataset.id; return renderAdmin();
    case 'adminTitle': return busy(async () => { await call('adminUpdate', { pw:A.pw, code:A.code, title:val('mt') }); await loadAdmin(); renderAdmin(); toast('제목을 저장했어요'); });
    case 'adminSettings': return busy(async () => { await call('adminUpdate', { pw:A.pw, code:A.code, groups:val('mg'), perLens:val('mp') }); await loadAdmin(); renderAdmin(); toast('설정을 저장했어요'); });
    case 'adminClear': {
      const w = el.dataset.w, label = { critiques:'비평 전체', cases:'회원 사례 전체(달린 비평 포함)', all:'비평과 회원 사례 전체' }[w];
      if (!confirm(`${label}를 삭제합니다. 되돌릴 수 없어요. 계속할까요?`)) return;
      return busy(async () => { await call('adminClear', { pw:A.pw, code:A.code, what:w }); A.open = null; await loadAdmin(); renderAdmin(); toast('삭제했어요'); });
    }
    case 'csv': return downloadCSV();
  }
});

if (!CONFIG.API_URL) document.getElementById('demo').innerHTML = '<div class="demo">체험 모드 — 이 브라우저에만 저장됩니다. 입장 코드 1234 · 운영진 비밀번호 1234</div>';
render();
</script>
</body>
