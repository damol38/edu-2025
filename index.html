<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손글씨 텍스트 변환기</title>
<style>
  :root{
    --paper:#FBFAF6;
    --line:#D9E4EC;
    --graphite:#2B2F33;
    --graphite-soft:#6B7480;
    --board:#2E5E4E;
    --board-deep:#234A3D;
    --chalk:#F3EFE4;
    --mark:#C74A32;
    --ok:#2E7D52;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--paper);
    color:var(--graphite);
    min-height:100vh;
    background-image:repeating-linear-gradient(transparent,transparent 27px,var(--line) 27px,var(--line) 28px);
  }
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
  header{
    background:var(--board);
    color:var(--chalk);
    border-radius:12px;
    padding:20px 22px 18px;
    margin-bottom:20px;
    box-shadow:0 3px 0 var(--board-deep);
  }
  header h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;}
  header p{font-size:.82rem;opacity:.85;margin-top:5px;line-height:1.5;}
  .drop{
    border:2px dashed var(--board);
    border-radius:12px;
    background:#fff;
    padding:34px 16px;
    text-align:center;
    cursor:pointer;
    transition:background .15s;
  }
  .drop:hover,.drop.on{background:#EFF5F2;}
  .drop .big{font-size:2rem;}
  .drop .t1{font-weight:700;margin-top:8px;}
  .drop .t2{font-size:.8rem;color:var(--graphite-soft);margin-top:4px;}
  input[type=file]{display:none;}
  .cards{margin-top:18px;display:flex;flex-direction:column;gap:16px;}
  .card{
    background:#fff;
    border:1px solid #E3E0D6;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .card-head{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;
    border-bottom:1px solid #EEEBE1;
  }
  .thumb{width:44px;height:58px;object-fit:cover;border-radius:6px;border:1px solid #ddd;flex-shrink:0;}
  .meta{flex:1;min-width:0;}
  .meta .who{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta .st{font-size:.78rem;color:var(--graphite-soft);margin-top:2px;}
  .st.err{color:var(--mark);}
  .st.done{color:var(--ok);}
  .card-body{padding:12px 14px;}
  textarea{
    width:100%;
    min-height:150px;
    border:1px solid #E0DDD2;
    border-radius:8px;
    padding:12px;
    font-family:inherit;
    font-size:.92rem;
    line-height:1.75;
    resize:vertical;
    background:#FDFDFB;
    color:var(--graphite);
  }
  textarea:focus{outline:2px solid var(--board);border-color:transparent;}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  button{
    font-family:inherit;
    border:none;border-radius:8px;
    padding:9px 16px;
    font-size:.85rem;font-weight:600;
    cursor:pointer;
  }
  button:focus-visible{outline:2px solid var(--graphite);outline-offset:2px;}
  .b-main{background:var(--board);color:var(--chalk);box-shadow:0 2px 0 var(--board-deep);}
  .b-main:active{transform:translateY(1px);box-shadow:none;}
  .b-sub{background:#EDEAE0;color:var(--graphite);}
  .b-sub:active{background:#E2DFD3;}
  button:disabled{opacity:.45;cursor:default;}
  .spin{
    display:inline-block;width:14px;height:14px;
    border:2px solid var(--chalk);border-top-color:transparent;
    border-radius:50%;
    animation:sp .7s linear infinite;
    vertical-align:-2px;margin-right:6px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none;}}
  .allbar{
    position:sticky;bottom:0;
    margin-top:20px;
    background:var(--chalk);
    border:1px solid #E0DBC8;
    border-radius:12px;
    padding:12px 14px;
    display:none;
    gap:10px;
    align-items:center;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);
  }
  .allbar.show{display:flex;flex-wrap:wrap;}
  .allbar .cnt{font-size:.85rem;font-weight:600;flex:1;}
  .hint{font-size:.75rem;color:var(--graphite-soft);margin-top:14px;line-height:1.6;}
  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(10px);
    background:var(--graphite);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:.85rem;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✏️ 손글씨 텍스트 변환기 <span style="font-size:.7em;opacity:.7">(Gemini)</span></h1>
    <p>학생 글쓰기 사진을 올리면 AI가 텍스트로 옮겨 적습니다.<br>읽기 어려운 글자는 [?]로 표시돼요. 변환 후 직접 고칠 수 있습니다.</p>
  </header>

  <div style="background:#fff;border:1px solid #E3E0D6;border-radius:12px;padding:14px;margin-bottom:16px;">
    <div style="font-weight:700;font-size:.9rem;margin-bottom:8px;">🔑 설정</div>
    <input type="password" id="apikey" placeholder="Google AI Studio API 키 붙여넣기"
      style="width:100%;padding:10px;border:1px solid #E0DDD2;border-radius:8px;font-size:.88rem;font-family:inherit;">
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
      <label style="font-size:.8rem;color:var(--graphite-soft);">모델</label>
      <input type="text" id="model" value="gemini-2.5-flash"
        style="flex:1;min-width:160px;padding:8px;border:1px solid #E0DDD2;border-radius:8px;font-size:.85rem;font-family:inherit;">
      <button class="b-sub" id="listModels" type="button">쓸 수 있는 모델 확인</button>
    </div>
    <div id="modelList" style="display:none;margin-top:8px;font-size:.8rem;line-height:1.7;"></div>
    <div style="font-size:.74rem;color:var(--graphite-soft);margin-top:8px;line-height:1.5;">
      키는 이 브라우저에만 저장되고 Google 외 다른 곳으로 전송되지 않아요.
      키 발급: <b>aistudio.google.com</b> → Get API key → Create API key
    </div>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple>
    <div class="big">📷</div>
    <div class="t1">사진 올리기 (여러 장 가능)</div>
    <div class="t2">탭해서 선택하거나 사진을 끌어다 놓으세요</div>
  </label>

  <div class="cards" id="cards"></div>

  <div class="allbar" id="allbar">
    <span class="cnt" id="allcnt"></span>
    <button class="b-main" id="copyAll">전체 복사</button>
    <button class="b-sub" id="clearAll">모두 지우기</button>
  </div>

  <p class="hint">💡 팁: 사진은 글씨가 화면에 꽉 차게, 그림자 없이 찍을수록 인식이 좋아요. 이름·번호가 학습지에 적혀 있으면 자동으로 찾아 제목에 붙입니다.</p>
</div>
<div class="toast" id="toast"></div>

<script>
const cards=document.getElementById('cards');
const allbar=document.getElementById('allbar');
const allcnt=document.getElementById('allcnt');
const toastEl=document.getElementById('toast');
let items=[]; // {id, name, text, status}
let seq=0;

function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1800);
}

// API 키를 브라우저에 저장 (GitHub Pages 등에서 재입력 불필요, 미리보기 환경에선 저장 안 될 수 있음)
(function(){
  const el=document.getElementById('apikey');
  try{const saved=localStorage.getItem('gemini_key');if(saved)el.value=saved;}catch(e){}
  el.addEventListener('change',()=>{
    try{localStorage.setItem('gemini_key',el.value.trim());}catch(e){}
  });
})();

// 사용 가능 모델 조회
document.getElementById('listModels').addEventListener('click',async()=>{
  const box=document.getElementById('modelList');
  const key=getKey();
  if(!key){box.style.display='block';box.textContent='먼저 API 키를 입력해 주세요';return;}
  box.style.display='block';
  box.textContent='조회 중...';
  try{
    const resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key)+'&pageSize=100');
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message);
    const names=(data.models||[])
      .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>m.name.replace('models/',''))
      .filter(n=>/gemini/.test(n)&&!/embedding|image|tts|audio|live/.test(n));
    if(!names.length){box.textContent='이 키로 쓸 수 있는 모델이 없어요. 키를 다시 확인해 주세요.';return;}
    box.innerHTML='이 키로 쓸 수 있는 모델 (탭하면 자동 입력):<br>'+
      names.map(n=>`<a href="#" data-m="${n}" style="color:var(--board);font-weight:600;">${n}</a>`).join(' · ');
    box.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{
      e.preventDefault();
      document.getElementById('model').value=a.dataset.m;
      toast('모델을 '+a.dataset.m+'(으)로 설정했어요');
    }));
  }catch(e){
    box.textContent='조회 실패: '+e.message;
  }
});

function refreshBar(){
  const done=items.filter(i=>i.status==='done').length;
  if(items.length>0){
    allbar.classList.add('show');
    allcnt.textContent=`총 ${items.length}장 · 변환 완료 ${done}장`;
  }else{
    allbar.classList.remove('show');
  }
}

// --- 파일을 dataURL로 읽기 ---
function readAsDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('파일을 읽을 수 없어요'));
    r.readAsDataURL(file);
  });
}

// --- 이미지 전처리: 대비 보정 + 긴 사진은 조각으로 분할 ---
async function shrink(file){
  const srcUrl=await readAsDataURL(file);
  try{
    const img=await new Promise((res,rej)=>{
      const im=new Image();
      im.onload=()=>res(im);
      im.onerror=()=>rej(new Error('decode'));
      im.src=srcUrl;
    });
    const MAX=1568;
    const W=img.width,H=img.height;

    // 한 조각을 캔버스로 만들어 대비 보정 후 dataURL 반환
    function makePiece(sy,sh){
      const sc=Math.min(1,MAX/Math.max(W,sh));
      const w=Math.round(W*sc),h=Math.round(sh*sc);
      const c=document.createElement('canvas');
      c.width=w;c.height=h;
      const ctx=c.getContext('2d');
      ctx.drawImage(img,0,sy,W,sh,0,0,w,h);
      // 흑백 + 대비 강화 (연필 글씨 선명하게)
      const d=ctx.getImageData(0,0,w,h);
      const p=d.data;
      for(let i=0;i<p.length;i+=4){
        let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
        g=(g-128)*1.45+128+10;
        g=g<0?0:g>255?255:g;
        p[i]=p[i+1]=p[i+2]=g;
      }
      ctx.putImageData(d,0,0);
      return c.toDataURL('image/jpeg',0.9);
    }

    const pieces=[];
    // 세로가 길어서 축소 손실이 큰 경우 → 위/아래 2조각 (10% 겹침)
    if(H>W*1.15 && H>MAX*1.3){
      const half=Math.round(H*0.55);
      pieces.push(makePiece(0,half));
      pieces.push(makePiece(Math.round(H*0.45),H-Math.round(H*0.45)));
    }else{
      pieces.push(makePiece(0,H));
    }
    return {pieces,media:'image/jpeg',thumb:pieces[0]};
  }catch(e){
    if(file.size>4.5*1024*1024) throw new Error('사진 용량이 너무 커요 (5MB 이하로 올려 주세요)');
    return {pieces:[srcUrl],media:file.type||'image/jpeg',thumb:srcUrl};
  }
}

// --- API 호출 ---
function getKey(){
  const el=document.getElementById('apikey');
  return el?el.value.trim():'';
}
function getModel(){
  const el=document.getElementById('model');
  return el?el.value.trim():'gemini-2.5-flash';
}
async function callClaude(content,maxTok){
  const key=getKey();
  if(!key) throw new Error('상단에 API 키를 먼저 입력해 주세요');
  // Claude 형식 content를 Gemini parts로 변환
  const parts=content.map(b=>{
    if(b.type==='image') return {inline_data:{mime_type:b.source.media_type,data:b.source.data}};
    return {text:b.text};
  });
  const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${getModel()}:generateContent?key=${encodeURIComponent(key)}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      contents:[{parts}],
      generationConfig:{temperature:0.2}
    })
  });
  const data=await resp.json();
  if(!resp.ok||data.error){
    const msg=data.error&&data.error.message?data.error.message:('API 오류 '+resp.status);
    if(resp.status===429) throw new Error('무료 사용량 한도에 걸렸어요. 1분 뒤 다시 시도하거나 내일 이어서 하세요');
    if(resp.status===400&&/API key/i.test(msg)) throw new Error('API 키가 올바르지 않아요. 다시 확인해 주세요');
    if(resp.status===404) throw new Error('모델 이름을 찾을 수 없어요. "쓸 수 있는 모델 확인"을 눌러 골라 주세요');
    throw new Error(msg);
  }
  const cand=data.candidates&&data.candidates[0];
  if(!cand||!cand.content||!cand.content.parts) throw new Error('응답이 비어 있어요. 다시 변환을 눌러 주세요');
  if(cand.finishReason==='MAX_TOKENS') throw new Error('응답이 중간에 잘렸어요. 다시 변환을 눌러 주세요');
  return cand.content.parts.map(p=>p.text||'').join('\n').trim();
}

const RULES=`먼저 글 전체를 훑어 무슨 이야기인지 파악한 뒤, 문맥을 적극 활용해 흘려 쓴 글자를 추론하세요. 초등학생 글에 자주 나오는 표현(엄마, 아빠, 게임, 숙제, 기분이 좋았다 등)을 참고하세요.

규칙:
1. 학생이 쓴 본문만 옮겨 적습니다. 인쇄된 안내문·제목은 제외합니다.
2. 맞춤법·띄어쓰기 오류도 학생이 쓴 그대로 유지합니다. 고치지 마세요.
3. 문맥으로도 도저히 읽을 수 없는 글자만 [?]로 표시합니다.`;

async function transcribePiece(piece,media,isFirst){
  const img={type:"image",source:{type:"base64",media_type:media,data:piece.split(',')[1]}};
  if(isFirst){
    const txt=await callClaude([img,{type:"text",text:`이 사진은 초등학생(3학년)이 손으로 쓴 글쓰기 학습지의 일부(위쪽)입니다.

${RULES}
4. 학습지 상단에 학년/반/번호/이름이 손글씨로 적혀 있으면 찾아서 적습니다. 없거나 못 읽으면 "정보없음"이라고 적습니다.
5. 사진 맨 아래에 잘린 채 걸쳐 있는 줄도 보이는 데까지 옮겨 적습니다.

반드시 아래 형식으로만 응답하세요. 다른 설명은 붙이지 마세요.
===학생===
(예: 3학년 5반 4번 김OO)
===본문===
(옮겨 적은 본문)`}]);
    let student='',text=txt;
    const m=txt.match(/===학생===\s*([\s\S]*?)\s*===본문===\s*([\s\S]*)/);
    if(m){student=m[1].trim();if(student==='정보없음')student='';text=m[2].trim();}
    return {student,text};
  }else{
    const txt=await callClaude([img,{type:"text",text:`이 사진은 초등학생(3학년)이 손으로 쓴 글쓰기 학습지의 일부(아래쪽)입니다.

${RULES}
4. 사진 맨 위에 잘린 채 걸쳐 있는 줄도 보이는 데까지 옮겨 적습니다.

옮겨 적은 본문만 출력하세요. 다른 설명은 붙이지 마세요.`}]);
    return {student:'',text:txt};
  }
}

async function mergeTexts(top,bottom){
  return callClaude([{type:"text",text:`한 장의 학습지를 위/아래 두 부분으로 나눠 각각 옮겨 적은 텍스트입니다. 두 부분은 경계에서 몇 줄이 겹칠 수 있습니다. 겹치는 문장은 한 번만 남기고 자연스럽게 이어 붙여, 전체 본문을 처음부터 끝까지 빠짐없이 출력하세요. 내용을 요약하거나 고치지 말고 그대로 이어 붙이기만 하세요. 이어 붙인 본문만 출력하고 다른 설명은 붙이지 마세요.

[위쪽 부분]
${top}

[아래쪽 부분]
${bottom}`}]);
}

async function transcribe(pieces,media,onStage){
  if(pieces.length===1){
    return transcribePiece(pieces[0],media,true);
  }
  onStage&&onStage('두 부분 나눠서 변환 중... (1/2)');
  const [a,b]=await Promise.all([
    transcribePiece(pieces[0],media,true),
    transcribePiece(pieces[1],media,false)
  ]);
  onStage&&onStage('위·아래 이어 붙이는 중... (2/2)');
  let merged;
  try{
    merged=await mergeTexts(a.text,b.text);
  }catch(e){
    merged='';
  }
  // 안전장치: 병합 결과가 위+아래 합친 것보다 지나치게 짧으면(병합 실패로 판단)
  // 그냥 기계적으로 이어 붙인다 (겹치는 한두 줄은 직접 지우면 됨)
  const rawLen=(a.text+b.text).length;
  if(!merged||merged.length<rawLen*0.55){
    merged=a.text+'\n'+b.text+'\n\n(※ 위·아래 자동 이어붙이기가 매끄럽지 않을 수 있어요. 중간에 겹치는 문장이 있으면 지워 주세요)';
  }
  return {student:a.student,text:merged};
}

// --- 카드 UI ---
function addCard(file){
  const id=++seq;
  const item={id,name:'사진 '+id,text:'',status:'loading'};
  items.push(item);

  const card=document.createElement('div');
  card.className='card';
  card.dataset.id=id;
  card.innerHTML=`
    <div class="card-head">
      <img class="thumb" alt="원본 사진 미리보기">
      <div class="meta">
        <div class="who">사진 ${id}</div>
        <div class="st"><span class="spin" style="border-color:var(--board);border-top-color:transparent"></span> 변환 중...</div>
      </div>
    </div>
    <div class="card-body">
      <textarea placeholder="변환 결과가 여기에 나타나요" disabled></textarea>
      <div class="btnrow">
        <button class="b-main" data-act="copy" disabled>복사</button>
        <button class="b-sub" data-act="retry" disabled>다시 변환</button>
        <button class="b-sub" data-act="del">삭제</button>
      </div>
    </div>`;
  cards.prepend(card);
  refreshBar();

  const thumb=card.querySelector('.thumb');
  const who=card.querySelector('.who');
  const st=card.querySelector('.st');
  const ta=card.querySelector('textarea');
  const bCopy=card.querySelector('[data-act=copy]');
  const bRetry=card.querySelector('[data-act=retry]');
  const bDel=card.querySelector('[data-act=del]');

  let pieces=null,mediaType='image/jpeg';

  async function run(){
    st.className='st';
    st.innerHTML='<span class="spin" style="border-color:var(--board);border-top-color:transparent"></span> 변환 중...';
    item.status='loading';
    bRetry.disabled=true;bCopy.disabled=true;ta.disabled=true;
    refreshBar();
    try{
      if(!pieces){
        const r=await shrink(file);
        thumb.src=r.thumb;
        pieces=r.pieces;
        mediaType=r.media;
      }
      const out=await transcribe(pieces,mediaType,msg=>{
        st.innerHTML='<span class="spin" style="border-color:var(--board);border-top-color:transparent"></span> '+msg;
      });
      if(out.student && out.student.trim()){
        who.textContent=out.student.trim();
        item.name=out.student.trim();
      }
      ta.value=out.text||'';
      item.text=ta.value;
      item.status='done';
      st.className='st done';
      const q=(ta.value.match(/\[\?\]/g)||[]).length;
      st.textContent= q>0 ? `변환 완료 · 확인 필요한 글자 ${q}곳` : '변환 완료';
      ta.disabled=false;bCopy.disabled=false;
    }catch(e){
      item.status='error';
      st.className='st err';
      st.textContent='변환 실패: '+e.message+' — 다시 변환을 눌러 주세요';
    }
    bRetry.disabled=false;
    refreshBar();
  }

  ta.addEventListener('input',()=>{item.text=ta.value;});
  bCopy.addEventListener('click',async()=>{
    await navigator.clipboard.writeText((item.name?item.name+'\n':'')+ta.value);
    toast('복사했어요');
  });
  bRetry.addEventListener('click',run);
  bDel.addEventListener('click',()=>{
    items=items.filter(i=>i.id!==id);
    card.remove();
    refreshBar();
  });

  run();
}

// --- 업로드 이벤트 ---
const drop=document.getElementById('drop');
const fileInput=document.getElementById('file');
fileInput.addEventListener('change',e=>{
  [...e.target.files].forEach(addCard);
  fileInput.value='';
});
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));
drop.addEventListener('drop',e=>{
  [...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(addCard);
});

// --- 전체 버튼 ---
document.getElementById('copyAll').addEventListener('click',async()=>{
  const done=items.filter(i=>i.status==='done');
  if(!done.length){toast('아직 변환된 글이 없어요');return;}
  const all=done.map(i=>`■ ${i.name}\n${i.text}`).join('\n\n────────────\n\n');
  await navigator.clipboard.writeText(all);
  toast(done.length+'장 전체 복사했어요');
});
document.getElementById('clearAll').addEventListener('click',()=>{
  items=[];cards.innerHTML='';refreshBar();
});
</script>
</body>
